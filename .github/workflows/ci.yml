name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "console;verbosity=detailed"

      - name: Publish
        run: dotnet publish WhatsAppBot/WhatsAppBot.csproj -c Release -o ./publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: ./publish
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t airline-service-platform:latest -f WhatsAppBot/Dockerfile WhatsAppBot/

      - name: Verify Docker image
        run: docker image inspect airline-service-platform:latest
